<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup Prediction Market</title>
    <script>
      (function() {
        // Define safe proxy getters for window.parent and window.top to shield any cross-origin property reads (like .ethereum)
        try {
          var originalParent = window.parent;
          Object.defineProperty(window, 'parent', {
            get: function() {
              try {
                var temp = originalParent.location.href;
                return originalParent;
              } catch (e) {
                return new Proxy({}, {
                  get: function(target, prop) {
                    return undefined;
                  },
                  has: function(target, prop) {
                    return false;
                  }
                });
              }
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        try {
          var originalTop = window.top;
          Object.defineProperty(window, 'top', {
            get: function() {
              try {
                var temp = originalTop.location.href;
                return originalTop;
              } catch (e) {
                return new Proxy({}, {
                  get: function(target, prop) {
                    return undefined;
                  },
                  has: function(target, prop) {
                    return false;
                  }
                });
              }
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Global error & promise rejection interceptors to capture and mute cross-origin/ethereum check errors early
        var isSecurityError = function(msg) {
          if (!msg) return false;
          var m = String(msg).toLowerCase();
          return m.indexOf("ethereum") !== -1 || 
                 m.indexOf("cross-origin") !== -1 ||
                 m.indexOf("securityerror") !== -1 ||
                 m.indexOf("blocked a frame") !== -1 ||
                 m.indexOf("property 'ethereum'") !== -1;
        };

        // Intercept window.onerror to suppress cross-origin / ethereum errors
        var originalOnerror = window.onerror;
        Object.defineProperty(window, 'onerror', {
          get: function() {
            return function(message, source, lineno, colno, error) {
              var msg = String(message || "");
              if (isSecurityError(msg)) {
                console.warn("Suppressing global error in custom window.onerror:", msg);
                return true; // suppresses the error
              }
              if (originalOnerror) {
                return originalOnerror.apply(this, arguments);
              }
              return false;
            };
          },
          set: function(newHandler) {
            originalOnerror = newHandler;
          },
          configurable: true,
          enumerable: true
        });

        // Monkey-patch window.addEventListener & window.removeEventListener to filter out and prevent propagation of these errors
        var originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
          if (type === 'error' || type === 'unhandledrejection') {
            var wrappedListener = function(event) {
              var msg = "";
              if (type === 'error') {
                msg = event.message || (event.error && event.error.message) || "";
              } else {
                msg = (event.reason && event.reason.message) || "";
              }
              if (isSecurityError(msg)) {
                console.warn("Intercepted and suppressed error in addEventListener:", msg);
                try {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                } catch(e) {}
                return true;
              }
              if (listener) {
                return listener.apply(this, arguments);
              }
            };
            if (listener) {
              listener._wrapped = wrappedListener;
            }
            return originalAddEventListener.call(this, type, wrappedListener, options);
          }
          return originalAddEventListener.call(this, type, listener, options);
        };

        var originalRemoveEventListener = window.removeEventListener;
        window.removeEventListener = function(type, listener, options) {
          if (type === 'error' || type === 'unhandledrejection') {
            var targetListener = listener && listener._wrapped ? listener._wrapped : listener;
            return originalRemoveEventListener.call(this, type, targetListener, options);
          }
          return originalRemoveEventListener.call(this, type, listener, options);
        };

        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
          console.log("Successfully defined writable window.fetch proxy");
        } catch (e) {
          console.warn("Failed to redefine window.fetch directly, trying prototype:", e);
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && proto.hasOwnProperty('fetch')) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return originalFetch; },
                set: function(val) { originalFetch = val; },
                configurable: true,
                enumerable: true
              });
              console.log("Successfully defined writable fetch on Window prototype");
            }
          } catch (err) {
            console.error("Failed to patch window.fetch setter:", err);
          }
        }

        // Safe window.parent & window.top wrapper to prevent cross-origin frame access errors (e.g., wallet/ethereum check)
        try {
          var realParent = window.parent;
          var realTop = window.top;

          function createSafeWindowProxy(realWin) {
            if (!realWin) return window;
            try {
              // Test if we can read location.href to detect cross-origin blocks
              var test = realWin.location.href;
              return realWin;
            } catch (e) {
              // It's cross-origin! Return a safe Proxy representing the parent/top window
              // We use an empty object {} as the target so that proxy operations never trigger cross-origin errors on the target.
              return new Proxy({}, {
                get: function(target, prop) {
                  if (typeof prop === 'symbol') {
                    return undefined;
                  }

                  // Only allow safe properties that are cross-origin permissible
                  var safeProps = {
                    postMessage: true,
                    blur: true,
                    focus: true,
                    close: true,
                    frames: true,
                    length: true,
                    parent: true,
                    self: true,
                    top: true,
                    window: true,
                    opener: true,
                    closed: true
                  };

                  if (prop === 'postMessage') {
                    return function() {
                      return realWin.postMessage.apply(realWin, arguments);
                    };
                  }

                  if (prop === 'location') {
                    try {
                      return realWin.location;
                    } catch (err) {
                      return undefined;
                    }
                  }

                  if (prop === 'parent' || prop === 'top' || prop === 'window' || prop === 'self') {
                    return createSafeWindowProxy(realWin[prop]);
                  }

                  // If it's a cross-origin forbidden property (like ethereum, ethereum-provider etc.),
                  // return undefined immediately to prevent the browser from logging/throwing cross-origin exceptions.
                  if (!safeProps[prop]) {
                    return undefined;
                  }

                  try {
                    return realWin[prop];
                  } catch (err) {
                    return undefined;
                  }
                },
                set: function(target, prop, value) {
                  if (prop === 'location') {
                    try {
                      realWin.location = value;
                      return true;
                    } catch (err) {
                      return false;
                    }
                  }
                  return false;
                },
                has: function(target, prop) {
                  var safeProps = {
                    postMessage: true,
                    blur: true,
                    focus: true,
                    close: true,
                    frames: true,
                    length: true,
                    parent: true,
                    self: true,
                    top: true,
                    window: true,
                    opener: true,
                    closed: true
                  };
                  return !!safeProps[prop];
                }
              });
            }
          }

          // Redefine on Window.prototype if available
          var descParent = Object.getOwnPropertyDescriptor(Window.prototype, 'parent') || 
                            Object.getOwnPropertyDescriptor(window, 'parent');
          var descTop = Object.getOwnPropertyDescriptor(Window.prototype, 'top') || 
                         Object.getOwnPropertyDescriptor(window, 'top');
          
          if (descParent && descParent.configurable) {
            try {
              Object.defineProperty(Window.prototype, 'parent', {
                get: function() { return createSafeWindowProxy(realParent); },
                configurable: true,
                enumerable: true
              });
            } catch (ep) {
              console.warn("Could not define parent on Window.prototype:", ep);
            }
          }
          if (descTop && descTop.configurable) {
            try {
              Object.defineProperty(Window.prototype, 'top', {
                get: function() { return createSafeWindowProxy(realTop); },
                configurable: true,
                enumerable: true
              });
            } catch (et) {
              console.warn("Could not define top on Window.prototype:", et);
            }
          }

          // Also redefine on window directly to ensure absolute precedence
          try {
            Object.defineProperty(window, 'parent', {
              get: function() { return createSafeWindowProxy(realParent); },
              configurable: true,
              enumerable: true
            });
          } catch (ewp) {
            console.warn("Could not define parent on window directly:", ewp);
          }
          try {
            Object.defineProperty(window, 'top', {
              get: function() { return createSafeWindowProxy(realTop); },
              configurable: true,
              enumerable: true
            });
          } catch (ewt) {
            console.warn("Could not define top on window directly:", ewt);
          }

          console.log("Safe window.parent and window.top wrappers successfully installed.");
        } catch (e) {
          console.warn("Failed to redefine window wrappers:", e);
        }
      })();
    </script>
